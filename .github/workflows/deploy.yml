name: Deploy

# Runs only after CI on `main` finishes successfully. Cancels in-flight
# deploys when a newer push lands so we never apply commit B and then
# commit A out of order.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: SSH deploy to Oracle VM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip if the upstream CI run failed (workflow_run fires on every
    # completion, success or not). Always run for manual dispatches.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Load SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key so the connection never prompts.
          ssh-keyscan -t ed25519 137.131.143.114 >> ~/.ssh/known_hosts 2>/dev/null

      # `git pull` runs as the `ubuntu` user, which is in the docker
      # group (set up at install time) — no sudo needed for compose.
      #
      # We rebuild only when source files actually changed under each
      # service's directory; this keeps redeploys fast when only the
      # README or workflows move. The `git diff --quiet` returns 1 when
      # there are changes, which our shell treats as "rebuild this one".
      # The frontend is tracked by commit instead (see .deploy-frontend-built).
      - name: Pull + selective rebuild + up
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@137.131.143.114 'bash -se' <<'EOF'
            set -euo pipefail
            cd /opt/node-forge

            BEFORE=$(git rev-parse HEAD)
            git pull --ff-only origin main
            AFTER=$(git rev-parse HEAD)

            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

            # The frontend is rebuilt by comparing the last commit that
            # touched frontend/ with the one the live bundle was built from
            # (recorded below, only once the new bundle actually serves)
            # instead of diffing BEFORE..AFTER. A missing or stale record
            # (first run, a cancelled or failed deploy) still triggers the
            # rebuild.
            FRONTEND_REV=$(git log -1 --format=%H -- frontend/)
            BUILT_REV=$(cat .deploy-frontend-built 2>/dev/null || true)

            REBUILD_TARGETS=()
            [ "$FRONTEND_REV" = "$BUILT_REV" ] || REBUILD_TARGETS+=(frontend)
            COMPOSE_CHANGED=false
            export BUILD_REV="$FRONTEND_REV"

            # Server state as a GitHub annotation (readable on the run page
            # and through the public API) whatever the outcome.
            LIVE_URL="${LIVE_URL:-https://node-forge.com.br/build-rev.txt}"
            diagnostics() {
              set +e
              {
                echo "head=$(git rev-parse --short HEAD) before=${BEFORE:0:7} frontend_rev=${FRONTEND_REV:0:7} built_rev=${BUILT_REV:0:7}"
                echo "targets=${REBUILD_TARGETS[*]:-none} compose_changed=$COMPOSE_CHANGED"
                echo "live_rev=$(curl -s --max-time 10 "$LIVE_URL" 2>&1 | head -c 60)"
                echo "container_rev=$($COMPOSE exec -T frontend cat public/build-rev.txt 2>&1 | head -c 60)"
                docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}} | {{.CreatedAt}}'
                docker inspect "$($COMPOSE ps -q frontend)" --format 'frontend image={{.Image}} cmd={{.Config.Cmd}} mounts={{len .Mounts}}' 2>&1
                docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.CreatedSince}}' | grep -i forge
                docker network ls --format '{{.Name}}' | grep -i net | while read -r n; do
                  echo "net $n: $(docker network inspect "$n" --format '{{range .Containers}}{{.Name}} {{end}}')"
                done
                git status --short | head -5
              } 2>&1 | sed -e ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::notice title=deploy diagnostics::/'
            }
            trap diagnostics EXIT
            if [ "$BEFORE" != "$AFTER" ]; then
              git diff --quiet "$BEFORE" "$AFTER" -- backend/  || REBUILD_TARGETS+=(backend)
              git diff --quiet "$BEFORE" "$AFTER" -- executor/ || REBUILD_TARGETS+=(executor)
              # Compose / Caddy changes warrant a full up.
              git diff --quiet "$BEFORE" "$AFTER" -- docker-compose.yml docker-compose.prod.yml Caddyfile \
                || COMPOSE_CHANGED=true
            fi

            if [ ${#REBUILD_TARGETS[@]} -eq 0 ] && [ "$COMPOSE_CHANGED" = false ]; then
              echo ">>> nothing to rebuild"
              exit 0
            fi

            has_target() { printf '%s\n' "${REBUILD_TARGETS[@]}" | grep -qx "$1"; }

            # Build every image first, while the current containers keep
            # serving. The frontend compiles its bundle inside the image
            # (Dockerfile `prod` stage), so a failed `next build` stops the
            # deploy here and the live site is untouched.
            if [ "$COMPOSE_CHANGED" = true ]; then
              echo ">>> building all images"
              $COMPOSE build
            else
              echo ">>> building: ${REBUILD_TARGETS[*]}"
              $COMPOSE build "${REBUILD_TARGETS[@]}"
            fi

            # Migrations run explicitly, before the new backend starts, and
            # only after a dump of the database. Migrations must stay
            # additive (the old backend keeps serving until the swap).
            if [ "$COMPOSE_CHANGED" = true ] || has_target backend; then
              $COMPOSE up -d postgres
              until $COMPOSE exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER"' >/dev/null 2>&1; do sleep 2; done
              mkdir -p -m 700 backups
              DUMP="backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ)-${AFTER:0:7}.dump"
              $COMPOSE exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$DUMP"
              echo ">>> database backup: $DUMP ($(du -h "$DUMP" | cut -f1))"
              # Keep the 10 most recent dumps.
              ls -1t backups/pre-deploy-*.dump | tail -n +11 | xargs -r rm --
              echo ">>> applying migrations"
              $COMPOSE run --rm --no-deps -T backend uv run --no-sync alembic upgrade head
            fi

            # Swap containers. Images are already built, so this is just a
            # restart per service.
            if [ "$COMPOSE_CHANGED" = true ]; then
              echo ">>> compose or Caddyfile changed — applying full up"
              $COMPOSE up -d
            else
              echo ">>> restarting: ${REBUILD_TARGETS[*]}"
              $COMPOSE up -d "${REBUILD_TARGETS[@]}"
            fi

            if has_target frontend; then
              echo ">>> waiting for the frontend"
              for i in $(seq 1 60); do
                if $COMPOSE exec -T frontend wget -q -O /dev/null http://localhost:3000/login 2>/dev/null; then
                  echo "$FRONTEND_REV" > .deploy-frontend-built
                  echo ">>> frontend serving after ~$((i * 2))s"
                  break
                fi
                if [ "$i" -eq 60 ]; then
                  echo ">>> frontend did not come up in 2 min"
                  $COMPOSE logs --tail=80 frontend
                  exit 1
                fi
                sleep 2
              done
              # Leftovers from when the bundle was built at container start.
              docker volume rm node-forge_frontend_next_cache node-forge_frontend_node_modules >/dev/null 2>&1 || true

              # The container answering is not proof the public site serves
              # it (2026-10-13: a "successful" deploy kept the old site).
              # Check through Caddy; restart it once if it lags behind.
              live_rev() { curl -s --max-time 10 "$LIVE_URL" || true; }
              if [ "$(live_rev)" != "$FRONTEND_REV" ]; then
                echo ">>> public site not on $FRONTEND_REV yet — restarting caddy"
                $COMPOSE restart caddy
                for i in $(seq 1 30); do
                  [ "$(live_rev)" = "$FRONTEND_REV" ] && break
                  sleep 2
                done
              fi
              if [ "$(live_rev)" != "$FRONTEND_REV" ]; then
                echo "::error::public site serves '$(live_rev)', expected $FRONTEND_REV"
                exit 1
              fi
              echo ">>> public site serves $FRONTEND_REV"
            fi

            # Each build leaves the previous images dangling.
            docker image prune -f >/dev/null
          EOF

      - name: Smoke test
        run: |
          # The previous step only returns once the containers are swapped,
          # so the site should answer right away; allow ~1 min for the
          # backend to come up behind the proxy.
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://node-forge.com.br/api/health || true)
            if [ "$code" = "200" ]; then
              echo "smoke ok after ${i} attempts"; exit 0
            fi
            sleep 4
          done
          echo "smoke check failed — site never returned 200 on /api/health"; exit 1
