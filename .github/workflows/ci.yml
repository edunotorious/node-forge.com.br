name: CI

# Run on every push to main and on every PR targeting main.
# Concurrency is keyed on the ref so a fresh push cancels in-flight
# runs for the same branch — saves runner minutes on rapid iteration.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permissions are pinned tight per-job; the default token can only read
# the repo. Each job widens what it needs (CodeQL upload, etc.).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Frontend — lint, typecheck, build. No tests here; the Playwright suite
  # needs the full Docker stack and lives in the `e2e` job below.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # typecheck before build so route-validator errors surface against the
      # last green tree rather than getting masked by a build failure.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          BACKEND_INTERNAL_URL: http://localhost:8000
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ---------------------------------------------------------------------------
  # Backend — uv-managed Python 3.12; ruff lint + format check + pytest.
  # Pytest needs Postgres, so we run it as a GitHub Actions service container
  # — same major (16) as production.
  # ---------------------------------------------------------------------------
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nodeforge_test
        ports:
          - 5432:5432
        # Health-check loop so the job doesn't race the container.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/nodeforge_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  # ---------------------------------------------------------------------------
  # Executor — same Python tooling as backend. No uv.lock committed yet, so
  # `uv sync` resolves at run time; --no-dev keeps the install lean (ruff
  # is brought in below as a one-shot tool).
  # ---------------------------------------------------------------------------
  executor:
    name: executor (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: executor
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Ruff lint
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .

  # ---------------------------------------------------------------------------
  # End-to-end — boots the full Docker stack and runs the Playwright suite
  # against it. Lives in its own job so a failed lint/typecheck still gives
  # us the e2e signal in parallel, and so failures here come with an
  # uploaded HTML report for triage.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Playwright deps
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      # Compose v2 is preinstalled on ubuntu-latest. We seed a synthetic
      # .env (keys mirror .env.example) so the stack can boot. EMAIL_BACKEND
      # is `stdout` — forgot-password just prints the link, no Resend call.
      # COOKIE_SECURE is false so the auth cookie is sent over plain HTTP.
      - name: Seed test .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=nodeforge
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/nodeforge
          JWT_SECRET=ci-test-jwt-secret-rotate-never-not-real-prod-value
          JWT_ALGORITHM=HS256
          JWT_EXPIRE_DAYS=7
          EXECUTOR_URL=http://executor:8001
          EXECUTOR_TIMEOUT_SECONDS=30
          CORS_ORIGINS=http://localhost:3000
          COOKIE_SECURE=false
          INTERNAL_API_TOKEN=ci-internal-token-not-real
          EMAIL_BACKEND=stdout
          EMAIL_FROM=ci@example.com
          RESEND_API_KEY=
          APP_BASE_URL=http://localhost:3000
          BACKEND_INTERNAL_URL=http://backend:8000
          NEXT_PUBLIC_API_URL=http://localhost:8000
          EOF

      - name: Bring up stack
        run: docker compose up -d --build

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/login -o /dev/null; then
              echo "frontend up after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "frontend never became reachable"; docker compose logs --tail=200; exit 1

      - name: Run E2E
        working-directory: frontend
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail=500

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v
