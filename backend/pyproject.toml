[project]
name = "nodeforge-backend"
version = "0.1.0"
description = "Node-Forge backend (FastAPI + SQLAlchemy + Postgres)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "pydantic[email]>=2.9.0,<3",
    "pydantic-settings>=2.5.0,<3",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.30.0,<0.31",
    "alembic>=1.14.0,<2",
    "httpx>=0.27.0,<1",
    "bcrypt>=4.2.0,<5",
    "pyjwt[crypto]>=2.9.0,<3",
    # Required by FastAPI for UploadFile / multipart form bodies (avatar
    # upload). Without it the app errors out at startup.
    "python-multipart>=0.0.18,<1",
    # In-memory rate limiting on auth endpoints. Backed by the `limits`
    # library; swap the storage URI to redis://… when we go multi-worker.
    "slowapi>=0.1.9,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
