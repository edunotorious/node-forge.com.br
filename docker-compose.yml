# Node-Forge — local development orchestration.
# Current state: PLACEHOLDER (Phase 1).
# Each service is declared here with its intended final shape; the matching
# Dockerfiles will be added in the phases noted below. `docker compose up`
# does not work until at least Phase 4 (postgres + backend + frontend) lands.

services:
  postgres:
    # Used from Phase 2 onward (backend skeleton + migrations).
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nodeforge}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  backend:
    # Implemented in Phase 2.
    # Bridges app-net and executor-net: the backend is the only service
    # allowed to reach the executor.
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      # Bind-mounts for hot reload in dev. uvicorn --reload picks up changes.
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - app-net
      - executor-net

  executor:
    # Phase 7 v2: spawns one ephemeral container per /run via the docker
    # daemon (docker.sock mounted from host). The runner image is this same
    # image reused — qiskit, qiskit-aer, matplotlib are baked in.
    #
    # WARNING: mounting docker.sock gives this container root-equivalent
    # access to the host docker daemon. Acceptable in dev, NOT for shared
    # servers or production without a real sandbox (gVisor, Firecracker,
    # rootless docker, or a dedicated VM per run).
    #
    # Reachable ONLY on executor-net (no host port published); the backend
    # is the sole client.
    #
    # Pinned `image:` so the built tag matches RUNNER_IMAGE regardless of
    # the directory the user (or CI) ran `docker compose up` from. Without
    # this, Compose names the image `<dirname>-executor:latest` and the
    # /run handler 500s with "Runner image not found".
    image: node-forge-executor:latest
    build:
      context: ./executor
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # The ephemeral runner is the same image this service runs from. If
      # you split a smaller runner image later, override this in .env.
      RUNNER_IMAGE: node-forge-executor:latest
    # ports:
    #   - "8001:8001"  # uncomment only for isolated debugging of the executor
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - executor-net

  frontend:
    # Implemented in Phase 4.
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Dev server stage; docker-compose.prod.yml switches to `prod`.
      target: base
    env_file: .env
    volumes:
      # Bind-mount the project for hot reload. Named volumes shadow the
      # bind-mount at /app/node_modules and /app/.next so the deps installed
      # during `docker build` and Next's build cache survive across restarts.
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
  executor-net:
    driver: bridge

volumes:
  pg_data:
  frontend_node_modules:
  frontend_next_cache:
