[project]
name = "nodeforge-executor"
version = "0.1.0"
description = "Node-Forge executor service (FastAPI runner for user Qiskit scripts)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.5.0,<3",
    # User-code dependencies — these live in the executor image because v1
    # runs scripts via subprocess inside this container (no separate runner
    # image yet). When we swap to docker.sock + ephemeral containers, these
    # move into a `runner` image and this list shrinks back to just FastAPI.
    "qiskit>=1.2.0,<2",
    "qiskit-aer>=0.15.0,<1",
    "matplotlib>=3.9.0,<4",
    "numpy>=2.0.0,<3",
    "pylatexenc>=2.10,<3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
