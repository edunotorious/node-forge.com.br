[project]
name = "nodeforge-executor"
version = "0.1.0"
description = "Node-Forge executor service (FastAPI runner for user Qiskit scripts)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<0.137",
    "uvicorn[standard]>=0.32.0,<0.33",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.5.0,<3",
    # docker SDK is how the executor talks to the host daemon (via the
    # mounted /var/run/docker.sock) to spawn one ephemeral runner container
    # per /run request.
    "docker>=7.1.0,<8",
    # User-code dependencies — bundled into this image because the runner
    # *is* this same image (reused via the docker daemon). Splitting into a
    # smaller runner-only image is a follow-up: would shrink each ephemeral
    # container's startup time and let us run multiple sandbox flavors.
    "qiskit>=1.2.0,<2",
    "qiskit-aer>=0.15.0,<1",
    "matplotlib>=3.9.0,<4",
    "numpy>=2.0.0,<3",
    "pylatexenc>=2.10,<3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
