# Production overlay.

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - app-net

  postgres:
    restart: unless-stopped
    # The base file publishes 5432 for local dev. Docker-published ports
    # bypass ufw, so in prod the DB must stay reachable only over app-net.
    ports: !reset []

  backend:
    restart: unless-stopped
    ports: !reset []
    # Run the code baked into the image: no source bind-mounts and no
    # --reload, so a `git pull` on the server can't change the running
    # API before the deploy rebuilt and migrated it. The deploy applies
    # migrations explicitly (after a backup); the upgrade here is a no-op
    # safety net for a manual `up`.
    volumes: !reset []
    command:
      - sh
      - -c
      - uv run --no-sync alembic upgrade head && exec uv run --no-sync uvicorn src.main:app --host 0.0.0.0 --port 8000
    environment:
      # Origin used in links inside emails (password reset). Pinned here,
      # next to the Caddyfile's hostname, so a missing/stale value in the
      # server .env can't send users to http://localhost:3000.
      APP_BASE_URL: https://node-forge.com.br
      # Same idea for the settings whose dev defaults are unsafe in prod.
      COOKIE_SECURE: "true"
      CORS_ORIGINS: https://node-forge.com.br

  executor:
    restart: unless-stopped

  frontend:
    restart: unless-stopped
    ports: !reset []
    # The `prod` stage compiles the bundle at image build time and runs
    # `next start`. No bind-mount or node_modules/.next volumes: those
    # would shadow what the image built.
    build:
      target: prod
      args:
        BUILD_REV: ${BUILD_REV:-unknown}
    volumes: !reset []
    environment:
      NODE_ENV: production

volumes:
  caddy_data:
  caddy_config:
